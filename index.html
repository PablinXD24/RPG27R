<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>Projetor Tático • Receptor de Mapa D&D 5e</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpolygon points='32,4 58,18 58,46 32,60 6,46 6,18' fill='%238b1e1e' stroke='%23e5c158' stroke-width='4'/%3E%3Ctext x='32' y='38' font-family='Georgia,serif' font-size='18' font-weight='bold' fill='%23f4ead5' text-anchor='middle'%3ED20%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: #050403;
      color: #f4ead5;
      font-family: 'Cinzel', Georgia, serif;
      overflow: hidden;
      user-select: none;
    }
    .font-display { font-family: 'Cinzel Decorative', Georgia, serif; }
    .font-heading { font-family: 'Cinzel', Georgia, serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
    .tactical-grid-overlay {
      background-size: 48px 48px;
      background-image:
        linear-gradient(to right, rgba(229, 193, 88, 0.28) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(229, 193, 88, 0.28) 1px, transparent 1px);
    }
  </style>
</head>
<body class="w-screen h-screen bg-[#050403] overflow-hidden">

  <!-- ========================================================= -->
  <!-- TELA DE CONEXÃO À SALA (EXIBIDA SE NÃO HOUVER ?room=...)  -->
  <!-- ========================================================= -->
  <div id="joinRoomScreen" class="fixed inset-0 z-50 bg-[#090604] flex items-center justify-center p-4">
    <div class="w-full max-w-md rounded-2xl p-6 sm:p-8 bg-gradient-to-br from-[#241710] to-[#160e0a] border-2 border-[#c59b27]/60 shadow-2xl text-center space-y-5">
      <div class="w-16 h-16 mx-auto rounded-full bg-gradient-to-br from-[#9b1c1c] to-[#580c0c] border-2 border-[#e5c158] flex items-center justify-center shadow-lg">
        <span class="font-display text-2xl text-[#f4ead5] font-black">D20</span>
      </div>
      <div>
        <h1 class="font-display text-2xl font-black text-[#e5c158]">Receptor de Mapa</h1>
        <p class="text-xs text-[#d6c29f]/80 mt-1">Digite o código da sala exibido na Central de Cartografia do Mestre</p>
      </div>

      <form onsubmit="receiver.handleJoinSubmit(event)" class="space-y-3">
        <input id="roomCodeInput" type="text" required placeholder="Ex: MESA-01" maxlength="20"
          class="w-full h-12 rounded-xl bg-black/55 border border-[#c59b27]/60 px-4 text-center font-mono-num text-lg font-bold uppercase tracking-widest text-[#e5c158] outline-none focus:border-[#e5c158]" />
        <button type="submit"
          class="w-full h-12 rounded-xl bg-gradient-to-r from-[#8b1e1e] to-[#691414] hover:from-[#a62424] hover:to-[#7a1818] border border-[#e5c158] text-[#f4ead5] font-heading font-bold text-sm uppercase tracking-wider shadow-lg transition cursor-pointer">
          📡 Conectar à Sala
        </button>
      </form>
    </div>
  </div>

  <!-- ========================================================= -->
  <!-- PALCO DE EXIBIÇÃO DO MAPA EM TEMPO REAL                   -->
  <!-- ========================================================= -->
  <div id="receiverScreen" class="hidden fixed inset-0 bg-[#050403] flex items-center justify-center overflow-hidden">

    <!-- Barra Discreta de Controles (Canto Superior Direito) -->
    <div class="absolute top-3 right-3 z-30 flex items-center gap-2 bg-black/75 backdrop-blur-md border border-[#c59b27]/40 rounded-full px-3 py-1.5 opacity-20 hover:opacity-100 transition-opacity duration-300">
      <span id="roomBadge" class="text-[11px] font-mono-num font-bold text-emerald-400 px-2 border-r border-[#c59b27]/30">SALA</span>
      <span id="mapTitleLabel" class="text-xs font-heading text-[#e5c158] px-1 max-w-[180px] truncate">Aguardando...</span>
      <button onclick="receiver.adjustZoom(-0.15)" class="w-7 h-7 rounded-full bg-white/10 hover:bg-white/20 text-[#f4ead5] font-mono-num text-sm flex items-center justify-center cursor-pointer" title="Diminuir Zoom">-</button>
      <button onclick="receiver.resetTransform()" class="px-2 h-7 rounded-full bg-white/10 hover:bg-white/20 text-[#f4ead5] font-mono-num text-[11px] cursor-pointer" title="Centralizar">100%</button>
      <button onclick="receiver.adjustZoom(0.15)" class="w-7 h-7 rounded-full bg-white/10 hover:bg-white/20 text-[#f4ead5] font-mono-num text-sm flex items-center justify-center cursor-pointer" title="Aumentar Zoom">+</button>
      <button onclick="receiver.toggleFullscreen()" class="w-7 h-7 rounded-full bg-[#8b1e1e] hover:bg-[#a62424] text-[#f4ead5] text-xs flex items-center justify-center cursor-pointer" title="Tela Cheia">⛶</button>
      <button onclick="receiver.switchRoom()" class="px-2 h-7 rounded-full bg-white/10 hover:bg-white/20 text-[#d6c29f] text-[10px] font-heading uppercase cursor-pointer" title="Trocar Sala">Trocar</button>
    </div>

    <!-- Viewport com Arrasto e Zoom -->
    <div id="mapViewport" class="w-full h-full flex items-center justify-center relative overflow-hidden cursor-grab active:cursor-grabbing">
      <div id="mapStageContainer" class="hidden relative inline-flex items-center justify-center transition-transform duration-100 ease-out">
        <img id="mapImageEl" src="" alt="Mapa da Sessão" class="max-w-screen max-h-screen w-auto h-auto object-contain block pointer-events-none select-none" />
        <div id="gridLayer" class="hidden absolute inset-0 tactical-grid-overlay pointer-events-none"></div>
        <div id="fogLayer" class="hidden absolute inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center pointer-events-none transition-all duration-300">
          <div class="text-center px-6 py-4 rounded-2xl bg-black/75 border border-[#c59b27]/40">
            <span class="text-3xl block mb-1">🌫️</span>
            <span class="font-display text-sm sm:text-base text-[#e5c158] tracking-widest uppercase">Território Oculto pelo Mestre</span>
          </div>
        </div>
        <div id="tokensLayer" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
      </div>

      <!-- Estado de Espera -->
      <div id="waitingState" class="text-center p-8 max-w-md">
        <div class="w-20 h-20 mx-auto rounded-full bg-gradient-to-br from-[#9b1c1c] to-[#3b0808] border-2 border-[#c59b27]/60 flex items-center justify-center mb-4 shadow-2xl animate-pulse">
          <span class="font-display text-3xl text-[#e5c158]">D20</span>
        </div>
        <h2 class="font-display text-xl text-[#e5c158] tracking-wider">Conectado à Sala <span id="waitingRoomCode" class="font-mono-num text-emerald-400"></span></h2>
        <p class="text-xs text-[#d6c29f]/75 mt-2">Aguardando o Mestre emitir um mapa na Central de Cartografia...</p>
      </div>
    </div>
  </div>

  <!-- ========================================================= -->
  <!-- FIREBASE REALTIME DATABASE (ESCUTA AO VIVO COM DOM PATCH) -->
  <!-- ========================================================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAL1LSLHbr_P0VRDEETpBeI9U6d8_dAQo0",
      authDomain: "rpg27-a394d.firebaseapp.com",
      databaseURL: "https://rpg27-a394d-default-rtdb.firebaseio.com",
      projectId: "rpg27-a394d",
      storageBucket: "rpg27-a394d.firebasestorage.app",
      messagingSenderId: "219813562576",
      appId: "1:219813562576:web:a49a239f2852bee67036d5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const TACTICAL_PINS_META = {
      party: { icon: '🚩', color: '#16a34a' },
      objective: { icon: '⭐', color: '#eab308' },
      danger: { icon: '💀', color: '#dc2626' },
      treasure: { icon: '💎', color: '#2563eb' },
      npc: { icon: '💬', color: '#9333ea' }
    };

    class MapReceiver {
      constructor() {
        this.roomCode = null;
        this.unsubImage = null;
        this.unsubState = null;
        this.currentMapId = null;

        this.zoom = 1;
        this.panX = 0;
        this.panY = 0;
        this.isDragging = false;
        this.startX = 0;
        this.startY = 0;

        this.initPanAndZoom();

        const params = new URLSearchParams(window.location.search);
        const urlRoom = (params.get('room') || '').trim().toUpperCase();
        const savedRoom = (localStorage.getItem('tomo_receiver_room') || '').trim().toUpperCase();

        if (urlRoom) {
          this.connectToRoom(urlRoom);
        } else if (savedRoom) {
          document.getElementById('roomCodeInput').value = savedRoom;
        }
      }

      handleJoinSubmit(e) {
        e.preventDefault();
        const code = document.getElementById('roomCodeInput').value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g, '');
        if (!code) return;
        this.connectToRoom(code);
      }

      switchRoom() {
        if (this.unsubImage) this.unsubImage();
        if (this.unsubState) this.unsubState();
        document.getElementById('receiverScreen').classList.add('hidden');
        document.getElementById('joinRoomScreen').classList.remove('hidden');
        document.getElementById('roomCodeInput').value = this.roomCode || '';
      }

      connectToRoom(code) {
        this.roomCode = code;
        localStorage.setItem('tomo_receiver_room', code);

        const url = new URL(window.location.href);
        url.searchParams.set('room', code);
        window.history.replaceState({}, '', url.toString());

        document.getElementById('joinRoomScreen').classList.add('hidden');
        document.getElementById('receiverScreen').classList.remove('hidden');
        document.getElementById('roomBadge').textContent = `SALA: ${code}`;
        document.getElementById('waitingRoomCode').textContent = code;

        if (this.unsubImage) this.unsubImage();
        if (this.unsubState) this.unsubState();

        // 1. Escuta a imagem do mapa (baixa 1x por troca de mapa)
        const imgRef = ref(db, `rooms/${code}/mapImage`);
        this.unsubImage = onValue(imgRef, (snap) => {
          const data = snap.val();
          const stage = document.getElementById('mapStageContainer');
          const waiting = document.getElementById('waitingState');
          const imgEl = document.getElementById('mapImageEl');
          const titleEl = document.getElementById('mapTitleLabel');

          if (data && data.imageUrl) {
            if (this.currentMapId !== data.mapId || imgEl.src !== data.imageUrl) {
              this.currentMapId = data.mapId;
              imgEl.src = data.imageUrl;
              this.resetTransform();
            }
            titleEl.textContent = data.name || 'Mapa Ativo';
            stage.classList.remove('hidden');
            waiting.classList.add('hidden');
          } else {
            this.currentMapId = null;
            imgEl.src = '';
            titleEl.textContent = 'Aguardando...';
            stage.classList.add('hidden');
            waiting.classList.remove('hidden');
          }
        });

        // 2. Escuta o estado tático leve e atualiza cada marcador diretamente no DOM (60fps)
        const stateRef = ref(db, `rooms/${code}/state`);
        this.unsubState = onValue(stateRef, (snap) => {
          const st = snap.val();
          if (!st) return;

          if (st.mapName) {
            document.getElementById('mapTitleLabel').textContent = st.mapName;
          }

          document.getElementById('gridLayer').classList.toggle('hidden', !st.showGrid);
          document.getElementById('fogLayer').classList.toggle('hidden', !st.fogEnabled);

          const tokensLayer = document.getElementById('tokensLayer');
          if (st.showTokens === false || st.showTokensOnProjector === false) {
            tokensLayer.innerHTML = '';
            return;
          }

          this.patchLiveMarkers(tokensLayer, st.tokens || {}, st.pins || {});
        });
      }

      patchLiveMarkers(layerEl, tokensObj, pinsObj) {
        const activeIds = new Set();

        // Atualiza ou cria tokens de personagens
        Object.entries(tokensObj).forEach(([key, tk]) => {
          if (!tk || tk.x === undefined || tk.y === undefined) return;
          const id = tk.charId || key;
          const domId = `rx-token-${id}`;
          activeIds.add(domId);

          const name = (tk.name || 'Herói').split(' ')[0];
          const avatar = tk.avatarUrl || `https://api.dicebear.com/7.x/adventurer/svg?seed=${encodeURIComponent(name)}`;

          let el = document.getElementById(domId);
          if (!el) {
            el = document.createElement('div');
            el.id = domId;
            el.style.cssText = 'transform: translate(-50%, -50%); transition: left 0.05s linear, top 0.05s linear; will-change: left, top;';
            el.className = 'absolute z-20 flex flex-col items-center pointer-events-none';
            el.innerHTML = `
              <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-full border-2 border-[#e5c158] bg-[#1a110b] shadow-[0_0_14px_rgba(0,0,0,0.95)] overflow-hidden flex items-center justify-center">
                <img src="${avatar}" alt="${name}" class="w-full h-full object-contain" />
              </div>
              <span class="mt-0.5 px-2 py-0.5 rounded bg-black/85 border border-[#c59b27]/70 text-[10px] sm:text-xs font-heading font-bold text-[#f4ead5] whitespace-nowrap shadow">
                ${name}
              </span>
            `;
            layerEl.appendChild(el);
          } else {
            const img = el.querySelector('img');
            const span = el.querySelector('span');
            if (img && img.src !== avatar) img.src = avatar;
            if (span && span.textContent.trim() !== name) span.textContent = name;
          }

          el.style.left = `${tk.x}%`;
          el.style.top = `${tk.y}%`;
        });

        // Atualiza ou cria pinos táticos
        Object.entries(pinsObj).forEach(([key, pin]) => {
          if (!pin || pin.x === undefined || pin.y === undefined) return;
          const id = pin.id || key;
          const domId = `rx-pin-${id}`;
          activeIds.add(domId);

          const meta = TACTICAL_PINS_META[pin.type] || TACTICAL_PINS_META.party;
          const icon = pin.icon || meta.icon;
          const color = pin.color || meta.color;
          const label = pin.label || '';

          let el = document.getElementById(domId);
          if (!el) {
            el = document.createElement('div');
            el.id = domId;
            el.style.cssText = 'transform: translate(-50%, -50%); transition: left 0.05s linear, top 0.05s linear; will-change: left, top;';
            el.className = 'absolute z-10 flex flex-col items-center pointer-events-none';
            el.innerHTML = `
              <div style="background-color: ${color};" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full border-2 border-white shadow-lg flex items-center justify-center text-sm sm:text-base">
                <span>${icon}</span>
              </div>
              <span class="mt-0.5 px-2 py-0.5 rounded bg-black/85 text-[10px] font-heading font-bold text-white whitespace-nowrap shadow">
                ${label}
              </span>
            `;
            layerEl.appendChild(el);
          } else {
            const labelSpan = el.querySelectorAll('span')[1];
            if (labelSpan && labelSpan.textContent.trim() !== label) labelSpan.textContent = label;
          }

          el.style.left = `${pin.x}%`;
          el.style.top = `${pin.y}%`;
        });

        // Remove marcadores que foram retirados do mapa
        Array.from(layerEl.children).forEach(child => {
          if (!activeIds.has(child.id)) {
            child.remove();
          }
        });
      }

      initPanAndZoom() {
        const viewport = document.getElementById('mapViewport');
        viewport.addEventListener('mousedown', (e) => {
          this.isDragging = true;
          this.startX = e.clientX - this.panX;
          this.startY = e.clientY - this.panY;
        });
        window.addEventListener('mousemove', (e) => {
          if (!this.isDragging) return;
          this.panX = e.clientX - this.startX;
          this.panY = e.clientY - this.startY;
          this.applyTransform();
        });
        window.addEventListener('mouseup', () => {
          this.isDragging = false;
        });
        viewport.addEventListener('wheel', (e) => {
          e.preventDefault();
          this.adjustZoom(e.deltaY < 0 ? 0.12 : -0.12);
        }, { passive: false });
      }

      adjustZoom(delta) {
        this.zoom = Math.max(0.5, Math.min(4, +(this.zoom + delta).toFixed(2)));
        this.applyTransform();
      }

      resetTransform() {
        this.zoom = 1;
        this.panX = 0;
        this.panY = 0;
        this.applyTransform();
      }

      applyTransform() {
        const stage = document.getElementById('mapStageContainer');
        if (stage) {
          stage.style.transform = `translate(${this.panX}px, ${this.panY}px) scale(${this.zoom})`;
        }
      }

      toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }
    }

    window.receiver = new MapReceiver();
  </script>
</body>
</html>
