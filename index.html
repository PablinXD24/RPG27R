<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>MapForge VTT - Receptor & Tela de Projeção</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #07090e;
    font-family: 'Inter', sans-serif; color: #f1f5f9;
    user-select: none;
  }
  .font-rpg { font-family: 'Cinzel', serif; }

  #viewport {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at center, #0f172a 0%, #05070a 100%);
    overflow: hidden;
  }

  #mapStage {
    position: relative;
    transform-origin: 0 0;
    will-change: transform;
  }

  #mapImage {
    display: block;
    max-width: none;
    pointer-events: none;
  }

  #gridOverlay, #fogCanvas, #tokensLayer {
    position: absolute; inset: 0;
    pointer-events: none;
  }

  .vtt-token {
    position: absolute;
    border-radius: 9999px;
    transform: translate(-50%, -50%);
    transition: left 0.25s cubic-bezier(0.22, 1, 0.36, 1), top 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 6px 18px rgba(0,0,0,0.75);
    display: flex; align-items: center; justify-content: center;
  }
  .vtt-token img {
    width: 100%; height: 100%; object-fit: cover; border-radius: 9999px;
  }
  .vtt-token-label {
    position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
    background: rgba(9, 13, 22, 0.88);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 1px 7px; border-radius: 999px;
    font-size: 10px; font-weight: 600; white-space: nowrap;
    color: #f8fafc; text-shadow: 0 1px 2px #000;
  }

  /* Camada de Cena Animada (Vídeo + Respiração 2D) */
  #animatedCastLayer {
    position: fixed; inset: 0; z-index: 40;
    display: none; align-items: center; justify-content: center;
    background: #04060a;
    opacity: 0; transition: opacity 0.45s ease;
  }
  #animatedCastLayer.active {
    display: flex; opacity: 1;
  }
  #castBgVideo {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
    z-index: 1;
  }
  #castBgFallback {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
    z-index: 1; display: none;
  }
  #castAnimCanvas {
    position: relative; z-index: 2;
    max-width: 92vw; max-height: 92vh;
    filter: drop-shadow(0 20px 45px rgba(0,0,0,0.85));
  }
  #castCaption {
    position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
    z-index: 3; background: rgba(8, 12, 20, 0.78);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(245, 158, 11, 0.35);
    padding: 8px 22px; border-radius: 999px;
    font-family: 'Cinzel', serif; font-size: 16px; letter-spacing: 0.06em;
    color: #fef3c7; text-shadow: 0 2px 6px rgba(0,0,0,0.9);
  }
</style>
</head>
<body>

  <!-- Tela de Conexão Inicial (caso não venha ?room= na URL) -->
  <div id="connectOverlay" class="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-7 shadow-2xl text-center">
      <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400">
        <i data-lucide="tv" class="w-7 h-7"></i>
      </div>
      <h1 class="font-rpg text-2xl font-bold text-amber-400 tracking-wide mb-1">MapForge Receptor</h1>
      <p class="text-xs text-slate-400 mb-6">Conecte esta tela à mesa do Mestre para receber o mapa, tokens e cenas animadas em tempo real.</p>
      
      <div class="space-y-3 text-left">
        <div>
          <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1">Código da Sala</label>
          <input id="roomCodeInput" type="text" placeholder="Ex: MESA-01" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white uppercase tracking-widest focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1">Firebase Database URL</label>
          <input id="firebaseUrlInput" type="text" placeholder="https://seu-projeto-default-rtdb.firebaseio.com" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-amber-500">
        </div>
        <button id="btnConnect" class="w-full mt-2 py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm transition shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2">
          <i data-lucide="radio" class="w-4 h-4"></i> Conectar à Mesa
        </button>
      </div>
    </div>
  </div>

  <!-- Barra de Status Discreta -->
  <div id="statusPill" class="fixed top-3 right-3 z-30 flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-950/75 border border-white/10 backdrop-blur-md text-[11px] text-slate-300 opacity-70 hover:opacity-100 transition">
    <span id="statusDot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
    <span id="statusText">Aguardando sala...</span>
  </div>

  <!-- Viewport Principal do Mapa -->
  <div id="viewport">
    <div id="emptyState" class="text-center text-slate-500">
      <i data-lucide="compass" class="w-12 h-12 mx-auto mb-3 opacity-30"></i>
      <p class="font-rpg text-sm tracking-widest uppercase">Aguardando transmissão do Mestre</p>
    </div>

    <div id="mapStage" style="display:none;">
      <img id="mapImage" alt="Mapa VTT">
      <canvas id="gridOverlay"></canvas>
      <div id="tokensLayer"></div>
      <canvas id="fogCanvas"></canvas>
    </div>
  </div>

  <!-- Camada Fullscreen de Cena Animada (Vídeo + Personagem 2D) -->
  <div id="animatedCastLayer">
    <video id="castBgVideo" autoplay loop muted playsinline></video>
    <img id="castBgFallback" alt="Cenário">
    <canvas id="castAnimCanvas"></canvas>
    <div id="castCaption" style="display:none;"></div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  lucide.createIcons();

  // Parâmetros da URL
  const params = new URLSearchParams(window.location.search);
  const urlRoom = (params.get('room') || '').trim().toUpperCase();
  const urlDb = (params.get('db') || localStorage.getItem('mf_fb_url') || '').trim();

  const connectOverlay = document.getElementById('connectOverlay');
  const roomCodeInput = document.getElementById('roomCodeInput');
  const firebaseUrlInput = document.getElementById('firebaseUrlInput');
  const btnConnect = document.getElementById('btnConnect');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  const viewport = document.getElementById('viewport');
  const emptyState = document.getElementById('emptyState');
  const mapStage = document.getElementById('mapStage');
  const mapImage = document.getElementById('mapImage');
  const gridOverlay = document.getElementById('gridOverlay');
  const tokensLayer = document.getElementById('tokensLayer');
  const fogCanvas = document.getElementById('fogCanvas');

  // Elementos da Cena Animada
  const animatedCastLayer = document.getElementById('animatedCastLayer');
  const castBgVideo = document.getElementById('castBgVideo');
  const castBgFallback = document.getElementById('castBgFallback');
  const castAnimCanvas = document.getElementById('castAnimCanvas');
  const castCaption = document.getElementById('castCaption');
  const castCtx = castAnimCanvas.getContext('2d');

  let currentState = null;
  let animRafId = null;
  let animCharImg = null;
  let animConfig = null;

  if (urlDb) firebaseUrlInput.value = urlDb;
  if (urlRoom) roomCodeInput.value = urlRoom;

  // Auto-conectar se ambos vierem na URL ou localStorage
  if (urlRoom && urlDb) {
    connectOverlay.style.display = 'none';
    startReceiver(urlRoom, urlDb);
  }

  btnConnect.addEventListener('click', () => {
    const room = roomCodeInput.value.trim().toUpperCase();
    const dbUrl = firebaseUrlInput.value.trim();
    if (!room || !dbUrl) {
      alert('Preencha o Código da Sala e a URL do Firebase.');
      return;
    }
    localStorage.setItem('mf_fb_url', dbUrl);
    connectOverlay.style.display = 'none';
    startReceiver(room, dbUrl);
  });

  function startReceiver(roomCode, databaseURL) {
    statusText.textContent = `Conectando: ${roomCode}...`;
    const app = initializeApp({ databaseURL });
    const db = getDatabase(app);

    // 1. Escutar Imagem do Mapa
    onValue(ref(db, `rooms/${roomCode}/mapImage`), (snap) => {
      const src = snap.val();
      if (!src) return;
      mapImage.onload = () => {
        emptyState.style.display = 'none';
        mapStage.style.display = 'block';
        setupCanvases();
        fitMapToScreen();
        if (currentState) renderState(currentState);
      };
      mapImage.src = src;
      statusDot.className = 'w-2 h-2 rounded-full bg-emerald-400';
      statusText.textContent = `Sala ${roomCode} • Ao vivo`;
    });

    // 2. Escutar Estado do Tabuleiro (Tokens, Grid, Névoa, Câmera)
    onValue(ref(db, `rooms/${roomCode}/state`), (snap) => {
      const state = snap.val();
      if (!state) return;
      currentState = state;
      if (mapImage.complete && mapImage.naturalWidth > 0) {
        renderState(state);
      }
    });

    // 3. Escutar Cenas Animadas (Vídeo de Fundo + Personagem Respirando 2D)
    onValue(ref(db, `rooms/${roomCode}/animatedCast`), (snap) => {
      const payload = snap.val();
      handleAnimatedCast(payload);
    });
  }

  function setupCanvases() {
    const w = mapImage.naturalWidth;
    const h = mapImage.naturalHeight;
    mapStage.style.width = w + 'px';
    mapStage.style.height = h + 'px';
    gridOverlay.width = w;
    gridOverlay.height = h;
    fogCanvas.width = w;
    fogCanvas.height = h;
  }

  function fitMapToScreen() {
    const w = mapImage.naturalWidth;
    const h = mapImage.naturalHeight;
    if (!w || !h) return;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const scale = Math.min(vw / w, vh / h);
    const tx = (vw - w * scale) / 2;
    const ty = (vh - h * scale) / 2;
    mapStage.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  }

  window.addEventListener('resize', () => {
    if (!currentState || !currentState.camera) fitMapToScreen();
  });

  function renderState(state) {
    // Câmera sincronizada (se o mestre enviar viewport)
    if (state.camera && typeof state.camera.scale === 'number') {
      const { x, y, scale } = state.camera;
      mapStage.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
    } else {
      fitMapToScreen();
    }

    // Grid
    const gCtx = gridOverlay.getContext('2d');
    gCtx.clearRect(0, 0, gridOverlay.width, gridOverlay.height);
    if (state.grid && state.grid.visible && state.grid.size > 8) {
      const size = state.grid.size;
      gCtx.strokeStyle = state.grid.color || 'rgba(255,255,255,0.18)';
      gCtx.lineWidth = 1;
      gCtx.beginPath();
      for (let x = 0; x <= gridOverlay.width; x += size) {
        gCtx.moveTo(x, 0); gCtx.lineTo(x, gridOverlay.height);
      }
      for (let y = 0; y <= gridOverlay.height; y += size) {
        gCtx.moveTo(0, y); gCtx.lineTo(gridOverlay.width, y);
      }
      gCtx.stroke();
    }

    // Tokens
    tokensLayer.innerHTML = '';
    const tokens = Array.isArray(state.tokens) ? state.tokens : Object.values(state.tokens || {});
    tokens.forEach(tk => {
      if (tk.hidden) return;
      const el = document.createElement('div');
      el.className = 'vtt-token';
      const sz = tk.size || 48;
      el.style.width = sz + 'px';
      el.style.height = sz + 'px';
      el.style.left = tk.x + 'px';
      el.style.top = tk.y + 'px';
      el.style.border = `3px solid ${tk.borderColor || '#f59e0b'}`;
      el.style.background = tk.color || '#1e293b';

      if (tk.img) {
        const img = document.createElement('img');
        img.src = tk.img;
        el.appendChild(img);
      } else {
        el.textContent = (tk.name || '?').slice(0, 2).toUpperCase();
        el.style.fontWeight = '700';
        el.style.fontSize = Math.max(12, sz * 0.34) + 'px';
      }

      if (tk.name) {
        const lbl = document.createElement('div');
        lbl.className = 'vtt-token-label';
        lbl.textContent = tk.name;
        el.appendChild(lbl);
      }
      tokensLayer.appendChild(el);
    });

    // Névoa de Guerra
    const fCtx = fogCanvas.getContext('2d');
    fCtx.clearRect(0, 0, fogCanvas.width, fogCanvas.height);
    if (state.fog && state.fog.enabled) {
      fCtx.fillStyle = '#030508';
      fCtx.fillRect(0, 0, fogCanvas.width, fogCanvas.height);
      if (Array.isArray(state.fog.revealed)) {
        fCtx.globalCompositeOperation = 'destination-out';
        state.fog.revealed.forEach(r => {
          fCtx.beginPath();
          fCtx.arc(r.x, r.y, r.r || 60, 0, Math.PI * 2);
          fCtx.fill();
        });
        fCtx.globalCompositeOperation = 'source-over';
      }
    }
  }

  // =========================================================================
  // MOTOR DE CENA ANIMADA (VÍDEO DE FUNDO + RESPIRAÇÃO / SWAY 2D EM MALHA)
  // =========================================================================
  function stopAnimatedCast() {
    if (animRafId) {
      cancelAnimationFrame(animRafId);
      animRafId = null;
    }
    animatedCastLayer.classList.remove('active');
    setTimeout(() => {
      if (!animatedCastLayer.classList.contains('active')) {
        animatedCastLayer.style.display = 'none';
        castBgVideo.pause();
        castBgVideo.removeAttribute('src');
        castBgVideo.load();
      }
    }, 450);
  }

  function handleAnimatedCast(payload) {
    if (!payload || !payload.active) {
      stopAnimatedCast();
      return;
    }

    animConfig = {
      speed: payload.speed ?? 1.8,
      breathAmp: payload.breathAmp ?? 0.022,
      swayAmp: payload.swayAmp ?? 8,
      pivotY: payload.pivotY ?? 0.48,
      scale: payload.scale ?? 1.0,
      offsetX: payload.offsetX ?? 0,
      offsetY: payload.offsetY ?? 0
    };

    // Legenda / Título da Cena
    if (payload.title) {
      castCaption.textContent = payload.title;
      castCaption.style.display = 'block';
    } else {
      castCaption.style.display = 'none';
    }

    // Fundo (Vídeo MP4/WebM ou Imagem Estática)
    if (payload.bgVideoUrl) {
      castBgFallback.style.display = 'none';
      castBgVideo.style.display = 'block';
      if (castBgVideo.src !== payload.bgVideoUrl) {
        castBgVideo.src = payload.bgVideoUrl;
        castBgVideo.play().catch(() => {});
      }
    } else if (payload.bgImageUrl) {
      castBgVideo.style.display = 'none';
      castBgFallback.src = payload.bgImageUrl;
      castBgFallback.style.display = 'block';
    } else {
      castBgVideo.style.display = 'none';
      castBgFallback.style.display = 'none';
    }

    // Personagem PNG Transparente
    if (payload.charImageUrl) {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        animCharImg = img;
        startAnimationLoop();
      };
      img.src = payload.charImageUrl;
    } else {
      animCharImg = null;
      castCtx.clearRect(0, 0, castAnimCanvas.width, castAnimCanvas.height);
    }

    animatedCastLayer.style.display = 'flex';
    requestAnimationFrame(() => animatedCastLayer.classList.add('active'));
  }

  function startAnimationLoop() {
    if (animRafId) cancelAnimationFrame(animRafId);
    const startTime = performance.now();

    function renderFrame(now) {
      if (!animCharImg || !animConfig) return;
      const t = (now - startTime) / 1000;

      const iw = animCharImg.naturalWidth;
      const ih = animCharImg.naturalHeight;
      const pad = 80;
      castAnimCanvas.width = iw + pad * 2;
      castAnimCanvas.height = ih + pad * 2;

      castCtx.clearRect(0, 0, castAnimCanvas.width, castAnimCanvas.height);

      const phase = t * animConfig.speed * Math.PI;
      const breath = Math.sin(phase);
      const sway = Math.sin(phase * 0.5);

      const slices = 36;
      const sliceH = ih / slices;
      const chestLine = ih * animConfig.pivotY;

      castCtx.save();
      castCtx.translate(
        castAnimCanvas.width / 2 + animConfig.offsetX,
        castAnimCanvas.height / 2 + animConfig.offsetY
      );
      castCtx.scale(animConfig.scale, animConfig.scale);
      castCtx.translate(-iw / 2, -ih / 2);

      for (let i = 0; i < slices; i++) {
        const sy = i * sliceH;
        const normY = 1 - (sy / ih); // 1 no topo (cabeça), 0 na base (pés)

        // Influência maior no tronco/peito para respiração e no topo para balanço
        const distChest = Math.exp(-Math.pow((sy - chestLine) / (ih * 0.25), 2));
        const scaleX = 1 + breath * animConfig.breathAmp * distChest;
        const offsetY = -breath * (animConfig.breathAmp * ih * 0.35) * normY;
        const offsetX = sway * animConfig.swayAmp * Math.pow(normY, 1.4);

        const dw = iw * scaleX;
        const dx = (iw - dw) / 2 + offsetX;
        const dy = sy + offsetY;

        castCtx.drawImage(
          animCharImg,
          0, sy, iw, sliceH + 0.8,
          dx, dy, dw, sliceH + 0.8
        );
      }

      castCtx.restore();
      animRafId = requestAnimationFrame(renderFrame);
    }

    animRafId = requestAnimationFrame(renderFrame);
  }
</script>
</body>
</html>
