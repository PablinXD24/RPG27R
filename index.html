<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Receptor de Cartografia • Tomo D&D</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #050403;
      color: #f4ead5;
      font-family: 'Cinzel', Georgia, serif;
      margin: 0;
      overflow: hidden;
      user-select: none;
    }
    .font-display { font-family: 'Cinzel Decorative', Georgia, serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; }
    .tactical-grid-overlay {
      background-size: 48px 48px;
      background-image:
        linear-gradient(to right, rgba(229, 193, 88, 0.28) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(229, 193, 88, 0.28) 1px, transparent 1px);
    }
  </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center relative">

  <!-- Barra Superior Discreta -->
  <div class="absolute top-3 right-3 z-30 flex items-center gap-2 bg-black/80 backdrop-blur-md border border-[#c59b27]/50 rounded-full px-3 py-1.5 opacity-35 hover:opacity-100 transition-opacity duration-300">
    <span id="roomStatusPill" class="text-[11px] font-mono-num font-bold text-emerald-400 px-2 border-r border-[#c59b27]/30">SALA: --</span>
    <span id="mapTitleLabel" class="text-xs text-[#e5c158] px-2 max-w-[200px] truncate">Aguardando emissão...</span>
    <button onclick="adjustZoom(-0.15)" class="w-7 h-7 rounded-full bg-white/10 hover:bg-white/20 font-mono-num text-sm cursor-pointer">-</button>
    <button onclick="resetTransform()" class="px-2 h-7 rounded-full bg-white/10 hover:bg-white/20 font-mono-num text-[11px] cursor-pointer">100%</button>
    <button onclick="adjustZoom(0.15)" class="w-7 h-7 rounded-full bg-white/10 hover:bg-white/20 font-mono-num text-sm cursor-pointer">+</button>
    <button onclick="changeRoomPrompt()" class="px-2.5 h-7 rounded-full bg-[#2b1d0e] hover:bg-[#3d2914] border border-[#c59b27]/50 text-[10px] uppercase cursor-pointer">Trocar Sala</button>
    <button onclick="toggleFullscreen()" class="w-7 h-7 rounded-full bg-[#8b1e1e] hover:bg-[#a62424] text-xs cursor-pointer" title="Tela Cheia">⛶</button>
  </div>

  <!-- Palco Principal -->
  <div id="viewport" class="w-full h-full flex items-center justify-center relative overflow-hidden cursor-grab active:cursor-grabbing">
    <div id="stageContainer" class="hidden relative inline-flex items-center justify-center transition-transform duration-150 ease-out">
      <img id="mapImage" src="" alt="Mapa Emitido" class="max-w-screen max-h-screen w-auto h-auto object-contain block pointer-events-none" />
      <div id="gridLayer" class="hidden absolute inset-0 tactical-grid-overlay pointer-events-none"></div>
      <div id="fogLayer" class="hidden absolute inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center pointer-events-none">
        <div class="text-center px-6 py-4 rounded-2xl bg-black/75 border border-[#c59b27]/40">
          <span class="text-3xl block mb-1">🌫️</span>
          <span class="font-display text-sm sm:text-base text-[#e5c158] tracking-widest uppercase">Território Oculto pelo Mestre</span>
        </div>
      </div>
      <div id="markersLayer" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
    </div>

    <!-- Tela de Conexão / Espera -->
    <div id="waitingState" class="text-center p-8 max-w-md space-y-4">
      <div class="w-20 h-20 mx-auto rounded-full bg-gradient-to-br from-[#9b1c1c] to-[#3b0808] border-2 border-[#c59b27]/60 flex items-center justify-center shadow-2xl">
        <span class="font-display text-3xl text-[#e5c158]">D20</span>
      </div>
      <h1 class="font-display text-xl text-[#e5c158] tracking-wider">Receptor de Cartografia</h1>
      <p id="waitingDesc" class="text-xs text-[#d6c29f]/80">Informe o código da sala criada pelo Mestre para receber o mapa em tempo real.</p>

      <div class="flex items-center justify-center gap-2 pt-2">
        <input id="roomInput" type="text" maxlength="12" placeholder="EX: MESA-01"
          class="h-11 w-44 rounded-xl bg-black/70 border border-[#c59b27] px-3 text-center font-mono-num font-bold uppercase tracking-widest text-[#e5c158] outline-none" />
        <button onclick="connectFromInput()"
          class="h-11 px-5 rounded-xl bg-[#8b1e1e] hover:bg-[#a62424] border border-[#e5c158] text-xs font-bold uppercase tracking-wider cursor-pointer">
          Conectar
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAL1LSLHbr_P0VRDEETpBeI9U6d8_dAQo0",
      authDomain: "rpg27-a394d.firebaseapp.com",
      databaseURL: "https://rpg27-a394d-default-rtdb.firebaseio.com",
      projectId: "rpg27-a394d",
      storageBucket: "rpg27-a394d.firebasestorage.app",
      messagingSenderId: "219813562576",
      appId: "1:219813562576:web:a49a239f2852bee67036d5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentUnsub = null;
    let currentRoom = '';
    let zoom = 1, panX = 0, panY = 0, dragging = false, startX = 0, startY = 0;

    function sanitize(raw) {
      return (raw || '').toUpperCase().replace(/[^A-Z0-9_-]/g, '').slice(0, 12);
    }

    function connectToRoom(code) {
      const clean = sanitize(code) || 'MESA-01';
      currentRoom = clean;
      localStorage.setItem('tomo_receptor_room', clean);
      document.getElementById('roomStatusPill').textContent = `SALA: ${clean}`;
      document.getElementById('roomInput').value = clean;
      document.getElementById('waitingDesc').textContent = `Conectado à sala ${clean}. Aguardando o Mestre emitir o mapa...`;

      if (currentUnsub) currentUnsub();
      currentUnsub = onValue(ref(db, `rooms/${clean}`), (snap) => {
        renderRoom(snap.val());
      });
    }

    function renderRoom(data) {
      const stage = document.getElementById('stageContainer');
      const waiting = document.getElementById('waitingState');
      const img = document.getElementById('mapImage');
      const grid = document.getElementById('gridLayer');
      const fog = document.getElementById('fogLayer');
      const markers = document.getElementById('markersLayer');
      const title = document.getElementById('mapTitleLabel');

      if (!data || !data.imageUrl) {
        stage.classList.add('hidden');
        waiting.classList.remove('hidden');
        title.textContent = 'Aguardando emissão...';
        markers.innerHTML = '';
        return;
      }

      if (img.src !== data.imageUrl) {
        img.src = data.imageUrl;
        resetTransform();
      }

      grid.classList.toggle('hidden', !data.showGrid);
      fog.classList.toggle('hidden', !data.fogEnabled);
      title.textContent = data.mapName || 'Mapa Ativo';

      const tokens = Array.isArray(data.tokens) ? data.tokens : Object.values(data.tokens || {});
      const pins = Array.isArray(data.pins) ? data.pins : Object.values(data.pins || {});

      let html = '';
      if (data.showTokensOnProjector !== false) {
        tokens.forEach(tk => {
          if (!tk) return;
          html += `
            <div style="left:${tk.x}%; top:${tk.y}%; transform:translate(-50%,-50%);" class="absolute z-20 flex flex-col items-center transition-all duration-150">
              <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-full border-2 border-[#e5c158] bg-[#1a110b] shadow-xl overflow-hidden flex items-center justify-center">
                <img src="${tk.avatarUrl}" alt="${tk.name}" class="w-full h-full object-contain" />
              </div>
              <span class="mt-0.5 px-2 rounded bg-black/85 border border-[#c59b27]/70 text-[10px] sm:text-xs font-bold text-[#f4ead5] whitespace-nowrap">${tk.name}</span>
            </div>
          `;
        });
      }

      pins.forEach(pin => {
        if (!pin) return;
        html += `
          <div style="left:${pin.x}%; top:${pin.y}%; transform:translate(-50%,-50%);" class="absolute z-10 flex flex-col items-center transition-all duration-150">
            <div style="background-color:${pin.color || '#16a34a'};" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full border-2 border-white shadow-lg flex items-center justify-center text-sm sm:text-base">${pin.icon || '🚩'}</div>
            <span class="mt-0.5 px-2 rounded bg-black/85 text-[10px] font-bold text-white whitespace-nowrap">${pin.label}</span>
          </div>
        `;
      });

      markers.innerHTML = html;
      waiting.classList.add('hidden');
      stage.classList.remove('hidden');
    }

    window.connectFromInput = () => {
      const val = document.getElementById('roomInput').value;
      if (val.trim()) connectToRoom(val);
    };

    window.changeRoomPrompt = () => {
      const next = prompt('Digite o código da Sala de Emissão:', currentRoom);
      if (next && next.trim()) connectToRoom(next);
    };

    window.adjustZoom = (delta) => {
      zoom = Math.max(0.5, Math.min(4, +(zoom + delta).toFixed(2)));
      applyTransform();
    };

    window.resetTransform = () => {
      zoom = 1; panX = 0; panY = 0;
      applyTransform();
    };

    function applyTransform() {
      document.getElementById('stageContainer').style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
    }

    window.toggleFullscreen = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      else document.exitFullscreen().catch(() => {});
    };

    const viewport = document.getElementById('viewport');
    viewport.addEventListener('mousedown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
      dragging = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    });
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      applyTransform();
    });
    window.addEventListener('mouseup', () => { dragging = false; });
    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      adjustZoom(e.deltaY < 0 ? 0.1 : -0.1);
    }, { passive: false });

    const params = new URLSearchParams(window.location.search);
    const initialRoom = sanitize(params.get('room')) || sanitize(localStorage.getItem('tomo_receptor_room')) || 'MESA-01';
    connectToRoom(initialRoom);
  </script>
</body>
</html>
